name: Boss offline regression checks
on:
  push:
    branches: [main, boss-v15-advanced-economy, boss-v15-1-career-pathways, boss-v16-living-business-world, boss-v16-1-balance-and-people, boss-v17-game-first, boss-v18-ceo-leadership, boss-v19-org-autonomy, integration/v22-3-v22-4-release-candidate]
  pull_request:
    branches: [main]
jobs:
  game:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run standalone game regression checks
        run: node tests/v22-3c4-integrated-growth.cjs && node tests/v15-smoke.cjs && node tests/v16-world.cjs && node tests/v161-fixes.cjs && node tests/v17-game.cjs && node tests/v18-leadership.cjs && node tests/v19-delegation.cjs && node tests/v19-autonomy.cjs && node tests/v20-portfolio.cjs && node tests/v21-5-growth.cjs && node tests/v22-property-pace.cjs && node tests/v22-2-executive-leadership.cjs && node tests/v22-3-economic-balancing.cjs && node tests/v22-3a-economic-proof.cjs && node tests/v22-3b-economic-calibration.cjs && node tests/v22-3b-integrity.cjs && BOSS_ECONOMIC_MODEL=baseline node tests/v22-3b-sensitivity.cjs && BOSS_ECONOMIC_MODEL=minimal node tests/v22-3b-sensitivity.cjs && BOSS_ECONOMIC_MODEL=balanced node tests/v22-3b-sensitivity.cjs && BOSS_ECONOMIC_MODEL=pressure node tests/v22-3b-sensitivity.cjs && node tests/v22-3b-compare.cjs && node tests/v22-3c1-organic-hq.cjs && node tests/v22-3c3-organic-leadership.cjs && node tests/v22-4-ceo-experience.cjs && node tests/v22-4c-ceo-today.cjs && node tests/v22-3-v22-4-integration.cjs && node --experimental-websocket tests/v19-mobile-browser.cjs

      - name: Upload v22.3A economic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v22-3a-economic-proof
          path: reports/v22-3a-economic-proof.json
          if-no-files-found: warn

      - name: Upload v22.3B comparative economic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v22-3b-economic-calibration
          path: reports/v22-3b-economic-calibration.json
          if-no-files-found: warn

      - name: Upload four-model 7-stage calibration comparison
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v22-3b-sensitivity-evidence
          path: |
            reports/v22-3b-baseline.json
            reports/v22-3b-minimal.json
            reports/v22-3b-balanced.json
            reports/v22-3b-pressure.json
            reports/v22-3b-comparison.json
          if-no-files-found: warn

      - name: Upload v22.3C1 actual-engine earned-only HQ progression proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v22-3c1-organic-hq
          path: reports/v22-3c1-organic-hq.json
          if-no-files-found: warn

      - name: Upload v22.3C3 organic leadership competency evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v22-3c3-organic-leadership
          path: reports/v22-3c3-organic-leadership.json
          if-no-files-found: warn

      - name: Upload v22.3C4 integrated actual-engine HQ progression proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v22-3c4-integrated-growth
          path: reports/v22-3c4-integrated-growth.json
          if-no-files-found: warn

      - name: Upload v22.4B real Chromium screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boss-v22-4b-mobile-evidence
          path: reports/v22-4b-mobile/*.png
          if-no-files-found: warn

      - name: Upload v22.4D simplified Today and research screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boss-v22-4d-mobile-evidence
          path: reports/v22-4d-mobile/*.png
          if-no-files-found: error

      - name: Upload v22.4C actual CEO Today and property comparison screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boss-v22-4c-mobile-evidence
          path: reports/v22-4c-mobile/*.png
          if-no-files-found: warn
