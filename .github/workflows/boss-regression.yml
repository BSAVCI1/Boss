name: Boss offline regression checks
on:
  push:
    branches: [main, boss-v15-advanced-economy, boss-v15-1-career-pathways, boss-v16-living-business-world, boss-v16-1-balance-and-people, boss-v17-game-first, boss-v18-ceo-leadership, boss-v19-org-autonomy]
  pull_request:
    branches: [main]
jobs:
  game:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run standalone game regression checks
        run: node tests/v15-smoke.cjs && node tests/v16-world.cjs && node tests/v161-fixes.cjs && node tests/v17-game.cjs && node tests/v18-leadership.cjs && node tests/v19-delegation.cjs && node tests/v19-autonomy.cjs
      - name: Real Chromium 390px mobile UI smoke
        run: node tests/v19-mobile-browser.cjs
