name: Boss offline regression checks
on:
  push:
    branches: [main, boss-v15-advanced-economy, boss-v15-1-career-pathways, boss-v16-living-business-world, boss-v16-1-balance-and-people]
  pull_request:
    branches: [main]
jobs:
  game:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run standalone game regression checks
        run: node tests/v15-smoke.cjs && node tests/v16-world.cjs && node tests/v161-fixes.cjs
