name: Boss offline regression checks
# PRs share a concurrency group so new commits cancel only obsolete PR runs.
# Push/deployment checks use their unique run_id and are never auto-cancelled.
concurrency:
  group: boss-regression-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
on:
  push:
    branches: [main, boss-v15-advanced-economy, boss-v15-1-career-pathways, boss-v16-living-business-world, boss-v16-1-balance-and-people, boss-v17-game-first, boss-v18-ceo-leadership, boss-v19-org-autonomy, integration/v22-3-v22-4-release-candidate]
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review, edited]
    branches: [main]
jobs:
  ceo_mobile_fast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Prepare immutable v22.5A1 mobile screenshot baseline
        run: |
          set -euo pipefail
          BASELINE=c7ea477261bf76cd5b700e2878d7dfed949ad4b2
          mkdir -p reports
          git fetch --no-tags --depth=1 origin "$BASELINE"
          test "$(git rev-parse FETCH_HEAD)" = "$BASELINE"
          git show "$BASELINE:index.html" > reports/v22-5a2-before.html
          test -s reports/v22-5a2-before.html
          test "$(git hash-object reports/v22-5a2-before.html)" = "1b5718949207cf5927dad14d754cdf764b54a7e9"
          grep -q 'id="view-work"' reports/v22-5a2-before.html
          grep -q 'id="view-team"' reports/v22-5a2-before.html
          grep -q 'id="view-growth"' reports/v22-5a2-before.html
          echo "Immutable v22.5A1 screenshot baseline verified: $BASELINE / 1b5718949207cf5927dad14d754cdf764b54a7e9"
      - name: Real Chromium 390px and 414px CEO acceptance
        run: node --experimental-websocket tests/v19-mobile-browser.cjs
      - name: Upload v22.4D simplified Today and research screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boss-v22-4d-mobile-evidence
          path: reports/v22-4d-mobile/*.png
          if-no-files-found: error
      - name: Upload v22.4.1 real mobile CEO acceptance images
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boss-v22-4-1-mobile-evidence
          path: reports/v22-4-1-mobile/*.png
          if-no-files-found: error
      - name: Preserve v22.5B 390px and 414px People & Culture recommendations
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boss-v22-5b-culture-mobile-proof
          path: reports/v22-5b-mobile/*.png
          if-no-files-found: error
      - name: Preserve actual 390px and 414px CEO screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boss-v22-4-1-fast-mobile-proof
          path: reports/v22-4-1-mobile/*.png
          if-no-files-found: error
      - name: Preserve v22.5A1 real mobile policy screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boss-v22-5a1-policy-mobile-proof
          path: reports/v22-5a1-mobile/*.png
          if-no-files-found: error
      - name: Preserve v22.5A2 390px / 414px Work Team Growth before-and-after screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boss-v22-5a2-before-after
          path: reports/v22-5a2-mobile/*.png
          if-no-files-found: error
      - name: Preserve v23A product and customer mobile evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boss-v23a-business-mobile
          path: reports/v23a-mobile/*.png
          if-no-files-found: error
      - name: Preserve v23B real 390px and 414px investment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boss-v23b-capital-mobile
          path: reports/v23b-mobile/*.png
          if-no-files-found: error
      - name: Preserve final CEO real 390px / 414px decision and routing proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boss-v25-ceo-quality-mobile
          path: reports/v25-mobile/*.png
          if-no-files-found: error
      - name: Preserve v24C authentic owned production and wholesale mobile screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boss-v24c-factory-mobile
          path: reports/v24c-mobile/*.png
          if-no-files-found: error
      - name: Preserve v24B real 390px and 414px empire and people story evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boss-v24b-empire-stories-mobile
          path: reports/v24b-mobile/*.png
          if-no-files-found: error
      - name: Preserve v24A 390px and 414px campus evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boss-v24a-campus-mobile
          path: reports/v24a-mobile/*.png
          if-no-files-found: error
      - name: Preserve v23C real 390px and 414px acquisition evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boss-v23c-acquisitions-mobile
          path: reports/v23c-mobile/*.png
          if-no-files-found: error
      - name: Preserve six v22.6 real Chromium leadership-stage screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boss-v22-6-leadership-mobile
          path: reports/v22-6-mobile/*.png
          if-no-files-found: error
  ceo_clarity_fast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate CEO decision clarity before long economic replays
        run: node tests/v15-smoke.cjs && node tests/v17-game.cjs && node tests/v18-leadership.cjs && node tests/v19-delegation.cjs && node tests/v19-autonomy.cjs && node tests/v22-4-ceo-experience.cjs && node tests/v22-4c-ceo-today.cjs && node tests/v22-4-1-ceo-decision-clarity.cjs && node tests/v22-5a1-management-policy.cjs && node tests/v22-5a2-simplification.cjs && node tests/v22-5b-smart-management.cjs && node tests/v22-5c-autopilot.cjs && node tests/v22-6-leadership.cjs && node tests/v23a-product-customer.cjs && node tests/v23b-capital.cjs && node tests/v23c-acquisitions.cjs && node tests/v24a-campus.cjs && node tests/v24b-empire-stories.cjs && node tests/v24c-factory.cjs && node tests/v25-ceo-quality.cjs && node tests/v26a-story.cjs && node tests/v26b-workplace.cjs && node tests/v26c1-executive-room.cjs && node tests/v26c2-dialogue.cjs && node tests/v26d-visual-world.cjs
  # Temporary v26 development gate: owner approved deferring the multi-hour economic suite
  # until the final v26F release. Fast CEO/mobile/story/finance smoke remains mandatory.
  # Restore normal heavy regression policy after v26F ships.
  game:
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.title, 'v26F') || contains(github.event.head_commit.message, 'v26F') }}
    needs: [ceo_clarity_fast, ceo_mobile_fast]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Prepare immutable v22.5A1 mobile screenshot baseline
        run: |
          set -euo pipefail
          BASELINE=c7ea477261bf76cd5b700e2878d7dfed949ad4b2
          mkdir -p reports
          git fetch --no-tags --depth=1 origin "$BASELINE"
          test "$(git rev-parse FETCH_HEAD)" = "$BASELINE"
          git show "$BASELINE:index.html" > reports/v22-5a2-before.html
          test -s reports/v22-5a2-before.html
          test "$(git hash-object reports/v22-5a2-before.html)" = "1b5718949207cf5927dad14d754cdf764b54a7e9"
          grep -q 'id="view-work"' reports/v22-5a2-before.html
          grep -q 'id="view-team"' reports/v22-5a2-before.html
          grep -q 'id="view-growth"' reports/v22-5a2-before.html
          echo "Immutable v22.5A1 screenshot baseline verified: $BASELINE / 1b5718949207cf5927dad14d754cdf764b54a7e9"
      - name: Run standalone game regression checks
        run: node tests/v22-3c4-integrated-growth.cjs && node tests/v15-smoke.cjs && node tests/v16-world.cjs && node tests/v161-fixes.cjs && node tests/v17-game.cjs && node tests/v18-leadership.cjs && node tests/v19-delegation.cjs && node tests/v19-autonomy.cjs && node tests/v20-portfolio.cjs && node tests/v21-5-growth.cjs && node tests/v22-property-pace.cjs && node tests/v22-2-executive-leadership.cjs && node tests/v22-3-economic-balancing.cjs && node tests/v22-3a-economic-proof.cjs && node tests/v22-3b-economic-calibration.cjs && node tests/v22-3b-integrity.cjs && node tests/v22-5a1-management-policy.cjs && node tests/v22-5b-smart-management.cjs && node tests/v22-5c-autopilot.cjs && node tests/v22-6-leadership.cjs && node tests/v23a-product-customer.cjs && node tests/v23b-capital.cjs && node tests/v23c-acquisitions.cjs && node tests/v24a-campus.cjs && node tests/v24b-empire-stories.cjs && node tests/v24c-factory.cjs && node tests/v25-ceo-quality.cjs && node tests/v26a-story.cjs && node tests/v26b-workplace.cjs && node tests/v26c1-executive-room.cjs && node tests/v26c2-dialogue.cjs && node tests/v26d-visual-world.cjs && node tests/v22-3c1-organic-hq.cjs && node tests/v22-3c3-organic-leadership.cjs && node tests/v22-4-ceo-experience.cjs && node tests/v22-4c-ceo-today.cjs && node tests/v22-4-1-ceo-decision-clarity.cjs && node tests/v22-3-v22-4-integration.cjs

      - name: Upload v22.3A economic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v22-3a-economic-proof
          path: reports/v22-3a-economic-proof.json
          if-no-files-found: warn

      - name: Upload v22.3B comparative economic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v22-3b-economic-calibration
          path: reports/v22-3b-economic-calibration.json
          if-no-files-found: error

      - name: Upload v22.3C1 actual-engine earned-only HQ progression proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v22-3c1-organic-hq
          path: reports/v22-3c1-organic-hq.json
          if-no-files-found: warn

      - name: Upload v22.3C3 organic leadership competency evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v22-3c3-organic-leadership
          path: reports/v22-3c3-organic-leadership.json
          if-no-files-found: warn

      - name: Upload v22.3C4 integrated actual-engine HQ progression proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v22-3c4-integrated-growth
          path: reports/v22-3c4-integrated-growth.json
          if-no-files-found: warn

      - name: Upload v22.4B real Chromium screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boss-v22-4b-mobile-evidence
          path: reports/v22-4b-mobile/*.png
          if-no-files-found: warn


      - name: Upload v22.4C actual CEO Today and property comparison screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boss-v22-4c-mobile-evidence
          path: reports/v22-4c-mobile/*.png
          if-no-files-found: warn


  # Each sensitivity scenario uses independent simulated companies. Parallelize
  # without discarding model results or reducing assertions.
  economic_sensitivity:
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.title, 'v26F') || contains(github.event.head_commit.message, 'v26F') }}
    needs: [ceo_clarity_fast, ceo_mobile_fast]
    strategy:
      fail-fast: false
      matrix:
        model: [baseline, minimal, balanced, pressure]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Verify exact source SHA
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
      - name: Run economic model — ${{ matrix.model }}
        run: BOSS_ECONOMIC_MODEL=${{ matrix.model }} node tests/v22-3b-sensitivity.cjs
      - name: Save model evidence — ${{ matrix.model }}
        uses: actions/upload-artifact@v4
        with:
          name: v22-3b-model-${{ matrix.model }}
          path: reports/v22-3b-${{ matrix.model }}.json
          if-no-files-found: error

  economic_compare:
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.title, 'v26F') || contains(github.event.head_commit.message, 'v26F') }}
    needs: [game, economic_sensitivity]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Gather all four independent model reports
        uses: actions/download-artifact@v4
        with:
          pattern: v22-3b-model-*
          path: reports
          merge-multiple: true
      - name: Download canonical calibration evidence from full game job
        uses: actions/download-artifact@v4
        with:
          name: v22-3b-economic-calibration
          path: reports
      - name: Require five source artifacts and reconcile 288 checkpoints
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          for model in baseline minimal balanced pressure; do test -s "reports/v22-3b-$model.json"; done
          test -s "reports/v22-3b-economic-calibration.json"
          node tests/v22-3b-compare.cjs
      - name: Retain reconciled sensitivity results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v22-3b-sensitivity-evidence
          path: |
            reports/v22-3b-baseline.json
            reports/v22-3b-minimal.json
            reports/v22-3b-balanced.json
            reports/v22-3b-pressure.json
            reports/v22-3b-comparison.json
          if-no-files-found: error

  # One mandatory result rejects failed, cancelled and skipped jobs. PR runs
  # are automatically superseded; main push validation is never cancelled.
  exact_head_acceptance:
    if: always()
    needs: [ceo_mobile_fast, ceo_clarity_fast, game, economic_sensitivity, economic_compare]
    runs-on: ubuntu-latest
    steps:
      - name: Require v26 interim fast checks or final full economic suite
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          V26_FINAL: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.title, 'v26F') || contains(github.event.head_commit.message, 'v26F') }}
        run: |
          node -e "const n=JSON.parse(process.env.NEEDS_JSON),full=process.env.V26_FINAL==='true';for(const [k,v] of Object.entries(n)){const required=full||k==='ceo_mobile_fast'||k==='ceo_clarity_fast';if(required&&v.result!=='success'){console.error('REQUIRED '+k+' ended '+v.result);process.exitCode=1}else if(!required&&v.result!=='skipped'){console.error('DEFERRED '+k+' unexpectedly '+v.result);process.exitCode=1}}console.log(full?'FINAL v26 full suite':'INTERIM v26 mandatory fast/mobile/finance smoke, economic suite deferred')"
